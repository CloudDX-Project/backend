spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false

app:
  runtime-role: ${APP_RUNTIME_ROLE:api}

  recommendation:
    # 후보 재정렬 Bedrock 호출은 기본적으로 생략한다. 최종 일정 Planner 호출은 유지된다.
    bedrock-rerank-enabled: ${BEDROCK_RERANK_ENABLED:false}

  cache:
    provider: ${CACHE_PROVIDER:simple}
    namespace: ${CACHE_NAMESPACE:travel:local:cache:v3}
    local-max-entries: ${CACHE_LOCAL_MAX_ENTRIES:256}
    ttl:
      kakaoDrivingRoute: ${CACHE_ROUTE_TTL:15m}
      weatherShort: ${CACHE_WEATHER_SHORT_TTL:2h}
      weatherMid: ${CACHE_WEATHER_MID_TTL:6h}
      flightSchedule: ${CACHE_FLIGHT_TTL:12h}
      cafeCandidates: ${CACHE_CANDIDATE_TTL:30m}
      tripPlanAttractionCandidates: ${CACHE_CANDIDATE_TTL:30m}
      tripPlanRestaurantCandidates: ${CACHE_CANDIDATE_TTL:30m}
      tripPlanCafeCandidates: ${CACHE_CANDIDATE_TTL:30m}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}
  refresh-store-enabled: ${JWT_REFRESH_STORE_ENABLED:false}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  refresh-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}


weather:
  kma:
    short:
      service-key: ${KMA_SHORT_SERVICE_KEY:}
      base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

    mid:
      service-key: ${KMA_MID_SERVICE_KEY:}
      base-url: https://apis.data.go.kr/1360000/MidFcstInfoService


aws:
  bedrock:
    region: ${AWS_BEDROCK_REGION:ap-northeast-2}
    model-id: ${BEDROCK_MODEL_ID:apac.amazon.nova-lite-v1:0}

  sqs:
    region: ${AWS_SQS_REGION:${AWS_REGION:ap-northeast-2}}
    trip-plan:
      queue-url: ${TRIP_PLAN_QUEUE_URL:}
      wait-time-seconds: ${TRIP_PLAN_QUEUE_WAIT_TIME_SECONDS:20}
      visibility-timeout-seconds: ${TRIP_PLAN_QUEUE_VISIBILITY_TIMEOUT_SECONDS:900}
      poll-delay-ms: ${TRIP_PLAN_QUEUE_POLL_DELAY_MS:1000}

external:
  aerodatabox:
    base-url: https://aerodatabox.p.rapidapi.com
    api-key: ${AERODATABOX_API_KEY:}
    api-host: aerodatabox.p.rapidapi.com

  kakao-mobility:
    base-url: https://apis-navi.kakaomobility.com
    rest-api-key: ${KAKAO_REST_API_KEY:}


  accommodation:
      base-url: https://apis.data.go.kr

      lodging:
        path: /1741000/lodgings/info
        service-key: ${LODGING_API_KEY:}

      tourist-lodging:
        path: /1741000/tourist_accommodations/info
        service-key: ${TOURIST_LODGING_API_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
