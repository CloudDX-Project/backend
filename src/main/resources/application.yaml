spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000


weather:
  kma:
    short:
      service-key: ${KMA_SHORT_SERVICE_KEY:}
      base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

    mid:
      service-key: ${KMA_MID_SERVICE_KEY:}
      base-url: https://apis.data.go.kr/1360000/MidFcstInfoService


aws:
  bedrock:
    region: ${AWS_BEDROCK_REGION:ap-northeast-2}
    model-id: ${BEDROCK_MODEL_ID:global.amazon.nova-2-lite-v1:0}

external:
  aerodatabox:
    base-url: https://aerodatabox.p.rapidapi.com
    api-key: ${AERODATABOX_API_KEY:}
    api-host: aerodatabox.p.rapidapi.com

  accommodation:
      base-url: https://apis.data.go.kr

      lodging:
        path: /1741000/lodgings/info
        service-key: ${LODGING_API_KEY:}

      tourist-lodging:
        path: /1741000/tourist_accommodations/info
        service-key: ${TOURIST_LODGING_API_KEY:}